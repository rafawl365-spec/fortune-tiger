<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0303">
<title>Acessar o site</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:#fff;overflow-x:hidden;position:relative;
  background:
    radial-gradient(70% 50% at 15% 10%,rgba(255,120,20,.40),transparent 60%),
    radial-gradient(60% 45% at 90% 25%,rgba(255,40,50,.35),transparent 60%),
    radial-gradient(70% 50% at 50% 100%,rgba(255,200,60,.28),transparent 60%),
    linear-gradient(160deg,#1a0303 0%,#420a0a 50%,#1a0303 100%);
  background-attachment:fixed;
}
/* плавающие светящиеся шары */
.orb{position:fixed;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none;z-index:0;animation:float 14s ease-in-out infinite}
.o1{width:320px;height:320px;background:#ff7a1a;top:-80px;left:-90px}
.o2{width:280px;height:280px;background:#e5261f;bottom:-60px;right:-80px;animation-delay:-5s}
.o3{width:200px;height:200px;background:#ffc83d;top:45%;left:60%;opacity:.3;animation-delay:-9s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-40px) scale(1.15)}}
/* сетка */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
.page{
  position:relative;z-index:1;width:min(1100px,100%);
  padding:calc(20px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
  text-align:center;
}
.frame{
  position:relative;border-radius:20px;padding:2px;
  background:linear-gradient(135deg,#ffd76a,#ff5a1f 50%,#ffc83d);
  box-shadow:0 0 0 1px rgba(255,200,90,.4),0 0 28px rgba(255,140,30,.55),0 0 70px rgba(255,50,40,.35),0 20px 60px rgba(0,0,0,.45);
  animation:rise .9s cubic-bezier(.2,.8,.2,1) 1 both;
}
.frame::before{content:"";position:absolute;inset:-6px;z-index:-1;border-radius:26px;pointer-events:none;
  background:linear-gradient(120deg,#ff7a1a,#ffd76a,#ff2d3a,#ffb300,#ff7a1a);background-size:300% 300%;
  filter:blur(18px);opacity:.55;animation:edgeflow 7s linear infinite,edgepulse 3s ease-in-out infinite}
@keyframes edgeflow{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes edgepulse{0%,100%{opacity:.35}50%{opacity:.8}}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.preview{display:block;width:100%;height:auto;border-radius:18px;background:#1a0303}
.cta{
  position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  margin-top:28px;padding:18px 52px;border-radius:14px;
  background:linear-gradient(135deg,#2fd06b,#0f9d4d);
  color:#fff;text-decoration:none;font-size:20px;font-weight:800;letter-spacing:.3px;line-height:1;
  box-shadow:0 8px 28px rgba(34,197,94,.55),inset 0 1px 0 rgba(255,255,255,.35);
  animation:pulse 2s ease-in-out infinite;transition:transform .2s;
}
.cta::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
  transform:skewX(-20deg);animation:shine 3s ease-in-out infinite}
.cta svg{width:22px;height:22px;transition:transform .2s}
.cta:hover{transform:translateY(-2px) scale(1.03)}
.cta:hover svg{transform:translateX(4px)}
.cta:active{transform:scale(.97)}
@keyframes shine{0%,60%{left:-80%}100%{left:130%}}
@keyframes pulse{0%,100%{box-shadow:0 8px 28px rgba(34,197,94,.55),0 0 0 0 rgba(34,197,94,.55),inset 0 1px 0 rgba(255,255,255,.35)}
  50%{box-shadow:0 8px 28px rgba(34,197,94,.55),0 0 0 16px rgba(34,197,94,0),inset 0 1px 0 rgba(255,255,255,.35)}}
.promo{position:relative;display:flex;align-items:center;gap:16px;text-align:left;
  max-width:560px;margin:26px auto 0;padding:16px 20px 16px 16px;border-radius:18px;
  background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 10px 36px rgba(0,0,0,.35),0 0 30px rgba(255,190,40,.18);
  animation:rise .9s cubic-bezier(.2,.8,.2,1) .25s 1 both}
.gift{flex:none;width:74px;height:74px;display:grid;place-items:center;border-radius:50%;
  background:radial-gradient(circle at 30% 25%,#ffe27a,#ff9d1c 70%);
  box-shadow:0 6px 20px rgba(255,160,20,.55),inset 0 2px 0 rgba(255,255,255,.5);
  transform:rotate(-8deg);animation:wobble 2.6s ease-in-out infinite;transform-origin:50% 80%}
.gift svg{width:44px;height:44px}
@keyframes wobble{0%,60%,100%{transform:rotate(-8deg) scale(1)}70%{transform:rotate(8deg) scale(1.08)}80%{transform:rotate(-8deg) scale(1.08)}90%{transform:rotate(6deg) scale(1.04)}}
.promo-body{flex:1;min-width:0}
.promo-title{margin:0 0 8px;font-size:15px;font-weight:600;color:rgba(255,255,255,.85)}
.code{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  padding:11px 14px;border-radius:12px;border:2px dashed #ffc83d;background:rgba(255,200,61,.12);
  color:#ffd76a;font:inherit;font-size:26px;font-weight:900;letter-spacing:3px;cursor:pointer;text-shadow:0 0 14px rgba(255,200,61,.6)}
.code::after{content:"";position:absolute;top:0;left:-80%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);animation:shine 3.4s ease-in-out infinite}
.code small{font-size:11px;font-weight:700;letter-spacing:.5px;padding:5px 9px;border-radius:8px;background:#ffc83d;color:#3a2400;text-shadow:none;white-space:nowrap}
.code:active{transform:scale(.98)}
.code.done small{background:#3ddc84}
.pix{display:flex;width:max-content;max-width:100%;align-items:center;gap:10px;margin:18px auto 0;padding:9px 16px 9px 14px;border-radius:999px;
  background:#fff;box-shadow:0 6px 22px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.6);
  animation:rise .9s cubic-bezier(.2,.8,.2,1) .5s 1 both}
.pix .logo{height:26px;width:auto;display:block}
.pix .ok{width:24px;height:24px;flex:none;border-radius:50%;background:#22c55e;display:grid;place-items:center;box-shadow:0 0 0 3px rgba(34,197,94,.25)}
.pix .ok svg{width:14px;height:14px}

/* --- анимация картинки --- */
.stage{position:relative;overflow:hidden;border-radius:18px;line-height:0;transform:translateZ(0)}
.stage .preview{border-radius:0}
.spr{position:absolute;height:auto;pointer-events:none;will-change:transform;transform-origin:50% 50%}
.coin{animation:coinf 3.6s ease-in-out infinite}
.card{animation:cardf 4.4s ease-in-out infinite}
.a0{animation-duration:3.2s}.a1{animation-duration:3.9s;animation-delay:-1s}.a2{animation-duration:3.4s;animation-delay:-2s}
.a3{animation-duration:4.2s;animation-delay:-.6s}.a4{animation-duration:3.0s;animation-delay:-1.7s}.a5{animation-duration:4.6s;animation-delay:-2.5s}
.a6{animation-duration:4.8s}.a7{animation-duration:4.1s;animation-delay:-1.4s}.a8{animation-duration:3.7s;animation-delay:-2.2s}
@keyframes coinf{0%,100%{transform:translate(0,0) rotate(-3deg) scaleX(1)}25%{transform:translate(2px,-5px) rotate(2deg) scaleX(.95)}50%{transform:translate(-1px,-7px) rotate(4deg) scaleX(1)}75%{transform:translate(-3px,-2px) rotate(-1deg) scaleX(.96)}}
@keyframes cardf{0%,100%{transform:translate(0,0) rotate(-3deg)}50%{transform:translate(3px,-6px) rotate(3deg)}}
